name: Replace OmniChat Mode with Perplexity Remix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OmniChat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Perplexity Remix
        uses: actions/checkout@v4
        with:
          repository: rajeevranjan4348-arch/perplexity-remix
          ref: main
          path: .perplexity-remix

      - name: Replace OmniChat mode with the complete Perplexity Remix source
        shell: bash
        run: |
          set -uo pipefail

          rm -rf src/integrations/perplexity
          mkdir -p src/integrations/perplexity

          # Copy the complete Perplexity source tree so no research/chat UI,
          # hook, feature, agent, library, or component is omitted.
          cp -R .perplexity-remix/src/. src/integrations/perplexity/

          # The host app supplies its own entry point; these are not imported by the mode.
          rm -f src/integrations/perplexity/main.ts src/integrations/perplexity/main.tsx

          # Namespace all Perplexity @/ imports so they cannot resolve to OmniChat files.
          find src/integrations/perplexity -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 |
            xargs -0 sed -i 's#@/#@perplexity/#g'

          # Preserve Perplexity's complete visual system inside the mode. Tailwind utility
          # classes are generated by Omni's build, while these local rules/tokens restore
          # the Remix look without changing unrelated Omni pages.
          cp .perplexity-remix/src/index.css src/integrations/perplexity/perplexity.css
          sed -i '/^@tailwind base;/d; /^@tailwind components;/d; /^@tailwind utilities;/d' src/integrations/perplexity/perplexity.css

          # Remove document-global selectors from the imported stylesheet.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/integrations/perplexity/perplexity.css")
          s=p.read_text()
          s=s.replace("  html {", "  .perplexity-remix-scope {")
          s=s.replace("  body {", "  .perplexity-remix-scope {")
          s=s.replace("  .dark {", "  .perplexity-remix-scope.dark {")
          s=s.replace("  * {", "  .perplexity-remix-scope * {")
          s=s.replace("::-webkit-scrollbar", ".perplexity-remix-scope ::-webkit-scrollbar")
          s=s.replace("body > *", ".perplexity-remix-scope > *")
          p.write_text(s)
          PY

          # Remove the old OmniChat UI entirely; this mode is now the Remix UI.
          rm -f src/modes/OmniChatModeLegacy.tsx

          cat > src/modes/OmniChatMode.tsx <<'TSX'
          import React from 'react';
          import { BlinkProvider } from '@blinkdotnew/react';
          import PerplexityRemixApp from '../integrations/perplexity/App';
          import '../integrations/perplexity/perplexity.css';

          export const OmniChatMode: React.FC = () => (
            <div
              className="perplexity-remix-scope w-full h-full min-h-0 overflow-hidden"
              style={{
                ['--background' as string]: '0 0% 0%',
                ['--foreground' as string]: '0 0% 95%',
                ['--card' as string]: '0 0% 5%',
                ['--card-foreground' as string]: '0 0% 95%',
                ['--popover' as string]: '0 0% 5%',
                ['--popover-foreground' as string]: '0 0% 95%',
                ['--primary' as string]: '0 0% 95%',
                ['--primary-foreground' as string]: '0 0% 5%',
                ['--secondary' as string]: '0 0% 10%',
                ['--secondary-foreground' as string]: '0 0% 90%',
                ['--muted' as string]: '0 0% 12%',
                ['--muted-foreground' as string]: '0 0% 55%',
                ['--accent' as string]: '217 91% 60%',
                ['--accent-foreground' as string]: '0 0% 100%',
                ['--destructive' as string]: '0 62.8% 40%',
                ['--destructive-foreground' as string]: '0 0% 98%',
                ['--border' as string]: '0 0% 14%',
                ['--input' as string]: '0 0% 14%',
                ['--ring' as string]: '0 0% 60%',
                ['--radius' as string]: '0.75rem',
                ['--font-sans' as string]: "'Inter', system-ui, -apple-system, sans-serif",
                ['--font-mono' as string]: "'JetBrains Mono', monospace",
              }}
            >
              <BlinkProvider
                projectId={import.meta.env.VITE_BLINK_PROJECT_ID || 'perplexity-9xplge2w'}
                publishableKey={import.meta.env.VITE_BLINK_PUBLISHABLE_KEY || 'blnk_pk_xxx'}
                showBranding={false}
              >
                <PerplexityRemixApp />
              </BlinkProvider>
            </div>
          );

          export default OmniChatMode;
          TSX

          # Preserve all Perplexity public assets under a dedicated prefix.
          rm -rf public/perplexity-remix
          mkdir -p public/perplexity-remix
          if [ -d .perplexity-remix/public ]; then
            cp -R .perplexity-remix/public/. public/perplexity-remix/
          fi

          # Preserve the Perplexity suggestions endpoint as a Netlify Function.
          mkdir -p netlify/functions
          cat > netlify/functions/perplexity-suggestions.ts <<'TS'
          import type { Handler } from '@netlify/functions';

          const handler: Handler = async (event) => {
            if (event.httpMethod === 'OPTIONS') {
              return { statusCode: 204, headers: { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Methods': 'GET,POST,OPTIONS', 'Access-Control-Allow-Headers': 'authorization, content-type' }, body: '' };
            }
            try {
              const query = new URLSearchParams(event.rawQuery || '').get('q') ||
                (event.body ? JSON.parse(event.body).q : '');
              if (!query) {
                return { statusCode: 200, headers: { 'Access-Control-Allow-Origin': '*', 'Content-Type': 'application/json' }, body: JSON.stringify({ suggestions: [] }) };
              }
              const response = await fetch(`https://www.google.com/complete/search?client=chrome&q=${encodeURIComponent(query)}`);
              const data = await response.json() as [string, string[]];
              return {
                statusCode: 200,
                headers: { 'Access-Control-Allow-Origin': '*', 'Content-Type': 'application/json' },
                body: JSON.stringify({ suggestions: data[1] || [] }),
              };
            } catch {
              return {
                statusCode: 500,
                headers: { 'Access-Control-Allow-Origin': '*', 'Content-Type': 'application/json' },
                body: JSON.stringify({ error: 'Internal error' }),
              };
            }
          };

          export { handler }; 
          export default handler;
          TS

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const srcPkg = JSON.parse(fs.readFileSync('.perplexity-remix/package.json','utf8'));
          // Merge Remix dependencies without downgrading OmniChat's existing Vite/Tailwind/React toolchain.
          const existingDeps = {...pkg.dependencies};
          const existingDevDeps = {...pkg.devDependencies};
          pkg.dependencies = {...srcPkg.dependencies, ...existingDeps};
          pkg.devDependencies = {...srcPkg.devDependencies, ...existingDevDeps};
          // These packages are owned by the host build and must stay on OmniChat's versions.
          for (const name of ['react','react-dom','vite','@vitejs/plugin-react','typescript','tailwindcss','@tailwindcss/vite']) {
            if (existingDeps[name]) pkg.dependencies[name] = existingDeps[name];
            if (existingDevDeps[name]) pkg.devDependencies[name] = existingDevDeps[name];
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          NODE

          node <<'NODE'
          const fs = require('fs');
          const p = 'vite.config.ts';
          let s = fs.readFileSync(p,'utf8');
          if (!s.includes("'@perplexity'")) {
            s = s.replace(
              /alias:\s*\{([\s\S]*?)\n\s*\},/,
              (m, body) => "alias: {" + body + "\n        '@perplexity': path.resolve(__dirname, './src/integrations/perplexity'),\n      },"
            );
          }
          fs.writeFileSync(p,s);
          const t = 'tsconfig.json';
          const cfg = JSON.parse(fs.readFileSync(t,'utf8'));
          cfg.compilerOptions ||= {};
          cfg.compilerOptions.paths ||= {};
          cfg.compilerOptions.paths['@perplexity/*'] = ['./src/integrations/perplexity/*'];
          fs.writeFileSync(t, JSON.stringify(cfg,null,2)+'\n');
          NODE

          # Generate a single lockfile from OmniChat's dependency graph and capture diagnostics.
          : > perplexity-integration-build.log
          install_status=0
          npm install --legacy-peer-deps --ignore-scripts 2>&1 | tee -a perplexity-integration-build.log || install_status=$?

          lint_status=0
          npm run lint 2>&1 | tee -a perplexity-integration-build.log || lint_status=$?

          build_status=0
          npm run build 2>&1 | tee -a perplexity-integration-build.log || build_status=$?

          {
            echo
            echo "INSTALL_STATUS=$install_status"
            echo "LINT_STATUS=$lint_status"
            echo "BUILD_STATUS=$build_status"
          } >> perplexity-integration-build.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/perplexity src/modes/OmniChatMode.tsx public/perplexity-remix netlify/functions/perplexity-suggestions.ts package.json package-lock.json vite.config.ts tsconfig.json perplexity-integration-build.log
          git add -u src/modes/OmniChatModeLegacy.tsx
          git commit -m "feat: replace OmniChat mode with complete Perplexity Remix"
          git push origin main

          rm -rf .perplexity-remix

          if [ "$install_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
